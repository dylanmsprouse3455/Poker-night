<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080102">
<title>Hand Heat • Poker Night</title>
<style>
:root{--text:#fff8f8;--muted:#bfa9ae;--line:rgba(255,255,255,.09);--gold:#d8b56d;--gold2:#f5d99d;--heat:#650915;--glow:rgba(101,9,21,.55)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,rgba(132,12,29,.24),transparent 42%),linear-gradient(180deg,#050102 0%,#100204 48%,#050102 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background:repeating-linear-gradient(115deg,rgba(255,255,255,.02) 0 7px,transparent 7px 18px),repeating-linear-gradient(-115deg,rgba(255,255,255,.015) 0 9px,transparent 9px 20px);filter:blur(8px)}
body:after{content:"";position:fixed;inset:7px;border:3px solid var(--heat);border-radius:26px;box-shadow:inset 0 0 30px var(--glow),0 0 34px var(--glow);pointer-events:none;z-index:30;transition:.25s ease}
.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center}.back,.reset,.navbtn{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);padding:9px 13px;border-radius:999px;font-weight:800;text-decoration:none;font-size:.82rem;cursor:pointer}.reset{color:var(--gold2)}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.step{height:5px;border-radius:999px;background:rgba(255,255,255,.075)}.step.on{background:var(--heat);box-shadow:0 0 9px var(--glow)}
.panel{min-height:0;border:1px solid var(--line);background:linear-gradient(160deg,rgba(29,6,9,.96),rgba(10,2,3,.985));border-radius:28px;box-shadow:0 24px 64px rgba(0,0,0,.42);padding:18px;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
.head{text-align:center}.eyebrow{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2);font-weight:850}.title{margin:6px 0 4px;font-size:clamp(1.8rem,6vw,3.2rem);letter-spacing:-.045em;line-height:.95}.sub{margin:0;color:var(--muted);font-size:.82rem;line-height:1.35}
.cards{display:flex;justify-content:center;gap:8px;margin:14px 0 12px}.slot{width:min(16vw,68px);height:min(21vw,92px);min-width:46px;min-height:64px;border-radius:15px;border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.025);display:grid;place-items:center;color:rgba(255,255,255,.28);font-weight:900;position:relative;cursor:pointer;transition:.18s}.slot.filled{background:linear-gradient(145deg,#fffdf8,#e8e0d6);color:#171214;border:1px solid rgba(0,0,0,.2);box-shadow:0 10px 24px rgba(0,0,0,.23);font-size:1.12rem}.slot.red{color:#b7132a}.slot.active{outline:2px solid var(--gold);outline-offset:3px}.slot small{position:absolute;bottom:4px;font-size:.5rem;opacity:.55;color:inherit}
.content{min-height:0;display:grid;grid-template-columns:.9fr 1.1fr;gap:12px}.picker,.journey{min-height:0;border-radius:20px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.065);padding:14px;overflow:hidden}
.question{font-size:1.08rem;font-weight:900}.hint{color:var(--muted);font-size:.75rem;margin-top:3px}.rankgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.rank,.suit{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);font-weight:900;border-radius:13px;padding:11px 4px;cursor:pointer;transition:.15s}.rank:active,.suit:active{transform:scale(.97)}.suitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.suit{font-size:1.55rem;padding:17px 4px}.suit.red{color:#ff7a90}.suit:disabled{opacity:.16}
.journey{display:grid;grid-template-rows:auto auto 1fr;gap:10px}.journeyTitle{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:850}.path{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}.state{padding:14px;border-radius:17px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.075)}.state.now{background:radial-gradient(circle at top right,var(--glow),transparent 58%),rgba(255,255,255,.035);border-color:rgba(255,255,255,.09)}.stateLabel{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.state b{display:block;margin-top:5px;font-size:1.05rem}.state p{margin:5px 0 0;color:var(--muted);font-size:.72rem;line-height:1.4}.arrow{display:grid;place-items:center;color:var(--gold2);font-size:1.3rem}
.options{min-height:0;display:grid;align-content:start;gap:7px;overflow:auto;padding-right:2px}.option{padding:10px 11px;border-radius:14px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.065);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.option b{font-size:.82rem}.option span{display:block;color:var(--muted);font-size:.68rem;margin-top:2px;line-height:1.3}.chance{font-size:.78rem;font-weight:900;color:var(--gold2);white-space:nowrap}.empty{color:var(--muted);font-size:.76rem;text-align:center;padding:12px}
.bottom{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:radial-gradient(circle at right,var(--glow),transparent 52%),rgba(255,255,255,.03);box-shadow:0 0 20px var(--glow)}.heatlabel{font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);font-weight:850}.heatmain{font-size:.95rem;font-weight:900;margin-top:2px}.heatsub{color:var(--muted);font-size:.69rem;margin-top:1px}.nav{display:flex;gap:7px}.navbtn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1e0b03;border-color:transparent}.navbtn:disabled{opacity:.28}.hidden{display:none!important}
@media(max-width:720px){.panel{padding:14px;border-radius:24px}.content{grid-template-columns:1fr;grid-template-rows:auto 1fr}.picker{padding:12px}.journey{padding:12px}.rankgrid{grid-template-columns:repeat(7,1fr);gap:5px}.rank{padding:9px 2px;font-size:.79rem}.suit{padding:13px 2px}.path{gap:7px}.state{padding:10px}.state b{font-size:.9rem}.state p{font-size:.64rem}.options{grid-template-columns:repeat(2,1fr);gap:6px}.option{grid-template-columns:1fr;padding:8px}.chance{font-size:.7rem}.cards{margin:10px 0}.slot{width:min(14vw,58px);height:min(19vw,78px)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><a class="back" href="./">← Home</a><button class="reset" id="reset">New Hand</button></div>
<div class="progress" id="progress"></div>
<section class="panel">
<div class="head"><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><p class="sub" id="sub"></p></div>
<div class="cards" id="cards"></div>
<div class="content">
<div class="picker"><div class="question" id="question"></div><div class="hint" id="hint"></div><div id="rankGrid" class="rankgrid"></div><div id="suitGrid" class="suitgrid hidden"></div></div>
<div class="journey"><div class="journeyTitle">Your hand, explained simply</div><div class="path"><div class="state now"><div class="stateLabel">You are here</div><b id="nowHand">Nothing yet</b><p id="nowExplain">Enter your cards and this will explain your hand.</p></div><div class="arrow">→</div><div class="state"><div class="stateLabel">Best next direction</div><b id="nextBest">Waiting</b><p id="nextExplain">Your strongest realistic improvement will appear here.</p></div></div><div class="options" id="options"></div></div>
</div>
</section>
<div class="bottom"><div><div class="heatlabel">Hand Heat</div><div class="heatmain" id="heatMain">WAITING FOR CARDS</div><div class="heatsub" id="heatSub">Enter your two cards.</div></div><div class="nav"><button class="navbtn" id="back">Back</button><button class="navbtn primary" id="next">Next</button></div></div>
</div>
<script>
const SUITS=[['♠','s'],['♥','h'],['♦','d'],['♣','c']],RANKS=[['A',14],['K',13],['Q',12],['J',11],['10',10],['9',9],['8',8],['7',7],['6',6],['5',5],['4',4],['3',3],['2',2]];
const PAGES=[{name:'YOUR CARDS',idx:[0,1],title:'Your two cards',sub:'Start with the cards in your hand.'},{name:'FLOP',idx:[2,3,4],title:'Add the flop',sub:'Enter the first three cards on the table.'},{name:'TURN',idx:[5],title:'Add the turn',sub:'Enter the fourth community card.'},{name:'RIVER',idx:[6],title:'Add the river',sub:'Enter the final community card.'},{name:'RESULT',idx:[],title:'Your final hand',sub:'Here is exactly where your hand finished.'}];
let cards=Array(7).fill(null),page=0,active=0,pending=null,phase='rank';
const COLORS={risk:['#650915','rgba(101,9,21,.55)'],caution:['#a84318','rgba(168,67,24,.52)'],possible:['#b87b1d','rgba(184,123,29,.5)'],strong:['#b91e31','rgba(185,30,49,.55)'],monster:['#d8b56d','rgba(216,181,109,.58)']};
const lab=r=>RANKS.find(x=>x[1]===r)[0],sym=s=>SUITS.find(x=>x[1]===s)[0];
function setHeat(k){const c=COLORS[k];document.documentElement.style.setProperty('--heat',c[0]);document.documentElement.style.setProperty('--glow',c[1])}
function used(r,s,ignore=active){return cards.some((c,i)=>i!==ignore&&c&&c.r===r&&c.s===s)}
function complete(){return PAGES[page].idx.every(i=>cards[i])}
function firstMissing(){return PAGES[page].idx.find(i=>!cards[i])}
function combos(a,k){const o=[];function rec(s,p){if(p.length===k){o.push([...p]);return}for(let i=s;i<a.length;i++){p.push(a[i]);rec(i+1,p);p.pop()}}rec(0,[]);return o}
function eval5(c){const rs=c.map(x=>x.r).sort((a,b)=>b-a),cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);const flush=c.every(x=>x.s===c[0].s);let u=[...new Set(rs)];if(u.includes(14))u.push(1);u=[...new Set(u)].sort((a,b)=>b-a);let st=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){st=u[i];break}const g=Object.entries(cnt).map(([r,n])=>({r:+r,n})).sort((a,b)=>b.n-a.n||b.r-a.r);if(flush&&st===14)return{rank:9,name:'Royal Flush'};if(flush&&st)return{rank:8,name:'Straight Flush'};if(g[0].n===4)return{rank:7,name:'Four of a Kind'};if(g[0].n===3&&g[1].n===2)return{rank:6,name:'Full House'};if(flush)return{rank:5,name:'Flush'};if(st)return{rank:4,name:'Straight'};if(g[0].n===3)return{rank:3,name:'Three of a Kind'};if(g[0].n===2&&g[1]&&g[1].n===2)return{rank:2,name:'Two Pair'};if(g[0].n===2)return{rank:1,name:'One Pair'};return{rank:0,name:'High Card'}}
function bestHand(a){if(a.length<5){const c={};a.forEach(x=>c[x.r]=(c[x.r]||0)+1);const v=Object.values(c);if(v.includes(4))return{rank:7,name:'Four of a Kind'};if(v.includes(3)&&v.includes(2))return{rank:6,name:'Full House'};if(v.includes(3))return{rank:3,name:'Three of a Kind'};if(v.filter(x=>x===2).length>=2)return{rank:2,name:'Two Pair'};if(v.includes(2))return{rank:1,name:'One Pair'};return{rank:0,name:'High Card'}}let b={rank:-1,name:''};for(const c of combos(a,5)){const e=eval5(c);if(e.rank>b.rank)b=e}return b}
function explain(h){return{0:'No made hand yet. Your highest card is carrying you.',1:'Two cards match in rank. That gives you one pair.',2:'You have two separate pairs.',3:'Three cards share the same rank.',4:'Five cards connect in number order.',5:'Five cards share the same suit.',6:'Three of one rank plus a pair.',7:'All four cards of one rank.',8:'Five connected cards in the same suit.',9:'A-K-Q-J-10 in one suit — the best possible hand.'}[h.rank]}
function paths(a){if(a.length<2||a.length>=7)return[];const out=[],unseen=52-a.length,sc={s:0,h:0,d:0,c:0};a.forEach(c=>sc[c.s]++);for(const [s,n] of Object.entries(sc))if(n===4)out.push({name:'Flush',outs:9,detail:`One more ${sym(s)} completes a flush.`,pct:Math.round(9/unseen*100),power:5});let rs=[...new Set(a.map(c=>c.r))];if(rs.includes(14))rs.push(1);rs=[...new Set(rs)].sort((x,y)=>x-y);for(let st=1;st<=10;st++){const seq=[st,st+1,st+2,st+3,st+4],miss=seq.filter(r=>!rs.includes(r));if(miss.length===1){const need=miss[0]===1?14:miss[0];out.push({name:'Straight',outs:4,detail:`A ${lab(need)} completes a straight.`,pct:Math.round(4/unseen*100),power:4});break}}const cnt={};a.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);for(const [r,n] of Object.entries(cnt)){const rr=+r;if(n===1)out.push({name:`Pair of ${lab(rr)}s`,outs:3,detail:`Three unseen ${lab(rr)}s can pair this card.`,pct:Math.round(3/unseen*100),power:1});if(n===2)out.push({name:'Three of a Kind',outs:2,detail:`Two unseen ${lab(rr)}s can turn your pair into trips.`,pct:Math.round(2/unseen*100),power:3});if(n===3)out.push({name:'Four of a Kind',outs:1,detail:`One unseen ${lab(rr)} gives you quads.`,pct:Math.round(1/unseen*100),power:7})}const vals=Object.values(cnt);if(vals.includes(2)&&vals.includes(1))out.push({name:'Two Pair',outs:3,detail:'Pairing another rank gives you two pair.',pct:Math.round(3/unseen*100),power:2});if(vals.includes(3)&&vals.includes(1))out.push({name:'Full House',outs:3,detail:'Pairing another rank fills up your trips.',pct:Math.round(3/unseen*100),power:6});const seen=new Set();return out.filter(x=>!seen.has(x.name)&&seen.add(x.name)).sort((a,b)=>b.power-a.power||b.outs-a.outs).slice(0,5)}
function analyze(){const a=cards.filter(Boolean);if(a.length<2){setHeat('risk');return{hand:{rank:0,name:'Nothing yet'},paths:[],main:'WAITING FOR CARDS',sub:'Enter your two cards.'}}const h=bestHand(a),p=paths(a);let level='risk',label='HIGH RISK';if(h.rank>=6){level='monster';label='MONSTER'}else if(h.rank>=2){level='strong';label='STRONG'}else if(h.rank===1){level='caution';label='CAUTION'}else if(p.some(x=>x.outs>=8)){level='possible';label='POSSIBLE'}setHeat(level);return{hand:h,paths:p,main:`${h.name.toUpperCase()} — ${label}`,sub:p[0]?`Best next path: ${p[0].name}`:'No major improvement path on the next card.'}}
function q(i){return['Pick your first card','Pick your second card','Pick flop card 1','Pick flop card 2','Pick flop card 3','Pick the turn','Pick the river'][i]}
function render(){const a=analyze();document.getElementById('progress').innerHTML=PAGES.map((_,i)=>`<div class="step ${i<=page?'on':''}"></div>`).join('');document.getElementById('eyebrow').textContent=`STEP ${page+1} OF 5 • ${PAGES[page].name}`;document.getElementById('title').textContent=PAGES[page].title;document.getElementById('sub').textContent=PAGES[page].sub;const ids=page===4?[0,1,2,3,4,5,6]:PAGES[page].idx;const labels=['Card 1','Card 2','Flop 1','Flop 2','Flop 3','Turn','River'];document.getElementById('cards').innerHTML=ids.map(i=>{const c=cards[i],red=c&&(c.s==='h'||c.s==='d');return `<button class="slot ${c?'filled':''} ${red?'red':''} ${i===active&&page<4?'active':''}" onclick="selectSlot(${i})">${c?`${lab(c.r)}${sym(c.s)}`:'+'}<small>${labels[i]}</small></button>`}).join('');document.getElementById('question').textContent=page===4?'Hand complete':q(active);document.getElementById('hint').textContent=page===4?'Start a new hand whenever you are ready.':phase==='rank'?'Choose the card value.':'Now choose the suit.';document.getElementById('rankGrid').classList.toggle('hidden',phase!=='rank'||page===4);document.getElementById('suitGrid').classList.toggle('hidden',phase!=='suit'||page===4);document.getElementById('rankGrid').innerHTML=RANKS.map(([l,v])=>`<button class="rank" onclick="pickRank(${v})">${l}</button>`).join('');if(phase==='suit')document.getElementById('suitGrid').innerHTML=SUITS.map(([u,v])=>`<button class="suit ${v==='h'||v==='d'?'red':''}" ${used(pending,v)?'disabled':''} onclick="pickSuit('${v}')">${u}</button>`).join('');document.getElementById('nowHand').textContent=a.hand.name;document.getElementById('nowExplain').textContent=cards.filter(Boolean).length<2?'Enter both cards first.':explain(a.hand);const best=a.paths[0];document.getElementById('nextBest').textContent=best?best.name:(page===4?'Finished':'No clear jump yet');document.getElementById('nextExplain').textContent=best?`${best.detail} About ${best.pct}% on the next card.`:(page===4?'That is your completed hand.':'Keep adding cards and this will update.');document.getElementById('options').innerHTML=a.paths.length?a.paths.slice(1).map(x=>`<div class="option"><div><b>${x.name}</b><span>${x.detail}</span></div><div class="chance">~${x.pct}%</div></div>`).join(''):`<div class="empty">No other strong improvement path yet.</div>`;document.getElementById('heatMain').textContent=a.main;document.getElementById('heatSub').textContent=a.sub;document.getElementById('back').disabled=page===0&&phase==='rank';document.getElementById('next').textContent=page===4?'New Hand':'Next';document.getElementById('next').disabled=page<4&&!complete()}
function selectSlot(i){if(page===4)return;active=i;pending=null;phase='rank';render()}
function pickRank(r){pending=r;phase='suit';render()}
function pickSuit(s){if(used(pending,s))return;cards[active]={r:pending,s};pending=null;phase='rank';const m=firstMissing();if(m!==undefined)active=m;render()}
document.getElementById('next').onclick=()=>{if(page===4){resetHand();return}if(!complete())return;page++;active=page<4?(firstMissing()??PAGES[page].idx[0]):0;pending=null;phase='rank';render()};document.getElementById('back').onclick=()=>{if(phase==='suit'){phase='rank';pending=null}else if(page>0){page--;active=PAGES[page].idx[0]}render()};function resetHand(){cards=Array(7).fill(null);page=0;active=0;pending=null;phase='rank';render()}document.getElementById('reset').onclick=resetHand;render();
</script>
</body>
</html>
