<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080102"><title>Poker Hand Guide</title><style>:root{--text:#fff8f8;--muted:#bfa9ae;--line:rgba(255,255,255,.09);--gold:#d8b56d;--green:#4fd38a;--amber:#e3b45d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,rgba(132,12,29,.22),transparent 42%),linear-gradient(180deg,#050102,#100204 48%,#050102)}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:12px}.top{display:flex;justify-content:space-between}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);padding:9px 13px;border-radius:999px;font-weight:800;text-decoration:none}.panel{min-height:0;border:1px solid var(--line);background:linear-gradient(160deg,rgba(29,6,9,.96),rgba(10,2,3,.985));border-radius:26px;padding:14px;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}.head{text-align:center}.eyebrow{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#f5d99d;font-weight:850}.title{margin:5px 0 3px;font-size:clamp(1.6rem,6vw,2.8rem)}.sub{margin:0;color:var(--muted);font-size:.78rem}.cards{display:flex;justify-content:center;gap:7px;margin:10px 0}.slot{width:min(14vw,58px);height:min(18vw,76px);border-radius:14px;border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.025);display:grid;place-items:center;position:relative;color:rgba(255,255,255,.3);font-weight:900}.slot.filled{background:#f4ede5;color:#171214}.slot.red{color:#b7132a}.slot small{position:absolute;bottom:3px;font-size:.45rem;opacity:.55}.content{min-height:0;display:grid;grid-template-columns:.85fr 1.15fr;gap:10px}.picker,.spectrumBox{min-height:0;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);border-radius:18px;padding:12px;overflow:hidden}.question{font-weight:900}.hint{color:var(--muted);font-size:.72rem;margin-top:3px}.rankgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.rank,.suit{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:12px;padding:9px 3px;font-weight:900}.suitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.suit{font-size:1.4rem;padding:14px 3px}.suit.red{color:#ff7a90}.hidden{display:none!important}.current{padding:10px;border-radius:14px;background:rgba(79,211,138,.06);border:1px solid rgba(79,211,138,.28);margin-bottom:8px}.current b{display:block}.current span{color:var(--muted);font-size:.7rem}.spectrumTitle{font-size:.7rem;color:#f5d99d;text-transform:uppercase;letter-spacing:.12em;font-weight:850;margin-bottom:6px}.spectrum{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.spectrum::-webkit-scrollbar{display:none}.hand{scroll-snap-align:start;flex:0 0 140px;border-radius:14px;padding:9px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);opacity:.9}.hand.have{border-color:rgba(79,211,138,.55);background:rgba(79,211,138,.06)}.hand.possible{border-color:rgba(227,180,93,.38);background:rgba(227,180,93,.04)}.hand.dead{opacity:.32}.handTop{display:flex;justify-content:space-between;gap:5px}.handTop b{font-size:.72rem}.status{font-size:.53rem;font-weight:900}.have .status{color:var(--green)}.possible .status{color:var(--amber)}.example{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}.tiny{width:23px;height:31px;border-radius:6px;background:#f3ece3;color:#171214;display:grid;place-items:center;font-size:.55rem;font-weight:900}.tiny.need{background:transparent;border:1px dashed rgba(216,181,109,.55);color:#f5d99d}.hand p{margin:0;color:var(--muted);font-size:.58rem;line-height:1.25}.bottom{display:flex;justify-content:space-between;gap:8px}.primary{background:linear-gradient(135deg,#d8b56d,#f5d99d);color:#1e0b03;border-color:transparent}@media(max-width:720px){.content{grid-template-columns:1fr;grid-template-rows:auto 1fr}.rankgrid{grid-template-columns:repeat(7,1fr);gap:4px}.rank{padding:8px 1px;font-size:.76rem}}</style></head><body><div class="app"><div class="top"><a class="btn" href="./">← Home</a><button class="btn" id="reset">New Hand</button></div><section class="panel"><div class="head"><div class="eyebrow" id="stepLabel">YOUR CARDS</div><h1 class="title" id="title">Enter your cards</h1><p class="sub">See where your current hand sits across all 10 poker hand types.</p></div><div class="cards" id="cards"></div><div class="content"><div class="picker"><div class="question" id="question"></div><div class="hint" id="hint"></div><div id="rankGrid" class="rankgrid"></div><div id="suitGrid" class="suitgrid hidden"></div></div><div class="spectrumBox"><div class="current"><b id="currentHand">Nothing yet</b><span id="currentExplain">Add your cards and the hand guide updates automatically.</span></div><div class="spectrumTitle">Swipe through all 10 hands</div><div class="spectrum" id="spectrum"></div></div></div></section><div class="bottom"><button class="btn" id="back">Back</button><button class="btn primary" id="next">Next</button></div></div><script>const SUITS=[['♠','s'],['♥','h'],['♦','d'],['♣','c']],RANKS=[['A',14],['K',13],['Q',12],['J',11],['10',10],['9',9],['8',8],['7',7],['6',6],['5',5],['4',4],['3',3],['2',2]],HANDS=[['Royal Flush',9],['Straight Flush',8],['Four of a Kind',7],['Full House',6],['Flush',5],['Straight',4],['Three of a Kind',3],['Two Pair',2],['One Pair',1],['High Card',0]],PAGES=[[0,1],[2,3,4],[5],[6],[]];let cards=Array(7).fill(null),page=0,active=0,pending=null,phase='rank';const lab=r=>RANKS.find(x=>x[1]===r)[0],sym=s=>SUITS.find(x=>x[1]===s)[0];function combos(a,k){const o=[];function rec(s,p){if(p.length===k){o.push([...p]);return}for(let i=s;i<a.length;i++){p.push(a[i]);rec(i+1,p);p.pop()}}rec(0,[]);return o}function eval5(c){const rs=c.map(x=>x.r).sort((a,b)=>b-a),cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);const flush=c.every(x=>x.s===c[0].s);let u=[...new Set(rs)];if(u.includes(14))u.push(1);u=[...new Set(u)].sort((a,b)=>b-a);let st=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){st=u[i];break}const g=Object.entries(cnt).map(([r,n])=>({r:+r,n})).sort((a,b)=>b.n-a.n||b.r-a.r);if(flush&&st===14)return 9;if(flush&&st)return 8;if(g[0].n===4)return 7;if(g[0].n===3&&g[1].n===2)return 6;if(flush)return 5;if(st)return 4;if(g[0].n===3)return 3;if(g[0].n===2&&g[1]&&g[1].n===2)return 2;if(g[0].n===2)return 1;return 0}function bestRank(a){if(a.length<5){const cnt={};a.forEach(x=>cnt[x.r]=(cnt[x.r]||0)+1);const vals=Object.values(cnt);if(vals.includes(4))return 7;if(vals.includes(3))return 3;if(vals.filter(x=>x===2).length>=2)return 2;if(vals.includes(2))return 1;return 0}return Math.max(...combos(a,5).map(eval5))}function canReach(rank,a){if(rank===0)return true;const left=7-a.length;if(left<0)return false;const cnt={};a.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);const suits={s:0,h:0,d:0,c:0};a.forEach(c=>suits[c.s]++);const maxSuit=Math.max(...Object.values(suits)),maxSame=Math.max(0,...Object.values(cnt));let rs=[...new Set(a.map(c=>c.r))];if(rs.includes(14))rs.push(1);let need=5;for(let st=1;st<=10;st++){const seq=[st,st+1,st+2,st+3,st+4];need=Math.min(need,seq.filter(r=>!rs.includes(r)).length)}if(rank===9||rank===8)return maxSuit+left>=5&&need<=left;if(rank===7)return maxSame+left>=4;if(rank===6)return maxSame+left>=3&&left>=Math.max(0,3-maxSame);if(rank===5)return maxSuit+left>=5;if(rank===4)return need<=left;if(rank===3)return maxSame+left>=3;if(rank===2)return left>=0;if(rank===1)return maxSame>=2||left>=1;return true}function used(r,s){return cards.some((c,i)=>i!==active&&c&&c.r===r&&c.s===s)}function complete(){return PAGES[page].every(i=>cards[i])}function firstMissing(){return PAGES[page].find(i=>!cards[i])}function render(){const labels=['YOU 1','YOU 2','FLOP 1','FLOP 2','FLOP 3','TURN','RIVER'];const ids=page===4?[0,1,2,3,4,5,6]:PAGES[page];document.getElementById('cards').innerHTML=ids.map(i=>{const c=cards[i];return `<button class="slot ${c?'filled':''} ${c&&'hd'.includes(c.s)?'red':''}" onclick="pickSlot(${i})">${c?lab(c.r)+sym(c.s):'+'}<small>${labels[i]}</small></button>`}).join('');const a=cards.filter(Boolean),br=a.length>=2?bestRank(a):null,name=br===null?'Nothing yet':HANDS.find(x=>x[1]===br)[0];document.getElementById('currentHand').textContent=name;document.getElementById('currentExplain').textContent=br===null?'Add your two cards to begin.':'Green shows the hand you currently have. Gold shows hand types still reachable before the river.';document.getElementById('spectrum').innerHTML=HANDS.map(([n,r])=>{const state=br===r?'have':canReach(r,a)?'possible':'dead';return `<div class="hand ${state}"><div class="handTop"><b>${n}</b><span class="status">${state==='have'?'YOU ARE HERE':state==='possible'?'STILL POSSIBLE':'ELIMINATED'}</span></div><div class="example">${a.slice(0,4).map(c=>`<span class="tiny">${lab(c.r)}${sym(c.s)}</span>`).join('')}<span class="tiny need">?</span></div><p>${state==='have'?'This is your current best hand.':state==='possible'?'This hand can still be completed before the end.':'This path is no longer available from the cards left to come.'}</p></div>`}).join('');renderPicker();document.getElementById('next').disabled=page<4&&!complete();document.getElementById('next').textContent=page===4?'New Hand':'Next';document.getElementById('back').disabled=page===0&&phase==='rank'}function renderPicker(){const rg=document.getElementById('rankGrid'),sg=document.getElementById('suitGrid');if(page===4){document.getElementById('stepLabel').textContent='RESULT';document.getElementById('title').textContent='Your hand spectrum';document.getElementById('question').textContent='Hand complete';document.getElementById('hint').textContent='Swipe across the 10 hands to see where you landed.';rg.classList.add('hidden');sg.classList.add('hidden');return}const names=['YOUR CARDS','FLOP','TURN','RIVER'];document.getElementById('stepLabel').textContent=names[page];document.getElementById('title').textContent=['Your two cards','Add the flop','Add the turn','Add the river'][page];document.getElementById('question').textContent=['Pick your FIRST card','Pick your SECOND card','Pick FLOP card 1','Pick FLOP card 2','Pick FLOP card 3','Pick the TURN card','Pick the RIVER card'][active];document.getElementById('hint').textContent=phase==='rank'?'Tap the number or letter.':'Now tap the suit.';rg.classList.toggle('hidden',phase!=='rank');sg.classList.toggle('hidden',phase!=='suit');rg.innerHTML=RANKS.map(([l,v])=>`<button class="rank" onclick="pickRank(${v})">${l}</button>`).join('');if(phase==='suit')sg.innerHTML=SUITS.map(([u,v])=>`<button class="suit ${'hd'.includes(v)?'red':''}" ${used(pending,v)?'disabled':''} onclick="pickSuit('${v}')">${u}</button>`).join('')}window.pickSlot=i=>{if(page===4)return;active=i;pending=null;phase='rank';render()};window.pickRank=r=>{pending=r;phase='suit';renderPicker()};window.pickSuit=s=>{if(used(pending,s))return;cards[active]={r:pending,s};pending=null;phase='rank';const m=firstMissing();if(m!==undefined)active=m;render()};document.getElementById('next').onclick=()=>{if(page===4){reset();return}if(!complete())return;page++;active=page<4?(firstMissing()??PAGES[page][0]):0;phase='rank';render()};document.getElementById('back').onclick=()=>{if(phase==='suit'){phase='rank';pending=null}else if(page>0){page--;active=PAGES[page][0]}render()};function reset(){cards=Array(7).fill(null);page=0;active=0;pending=null;phase='rank';render()}document.getElementById('reset').onclick=reset;render();</script></body></html>
