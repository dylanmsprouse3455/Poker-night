<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080102">
<title>Hand Heat • Poker Night</title>
<style>
:root{--text:#fff8f8;--muted:#bfa9ae;--line:rgba(255,255,255,.09);--gold:#d8b56d;--gold2:#f5d99d;--heat:#650915;--glow:rgba(101,9,21,.55)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,rgba(132,12,29,.24),transparent 42%),linear-gradient(180deg,#050102 0%,#100204 48%,#050102 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(115deg,rgba(255,255,255,.02) 0 7px,transparent 7px 18px),repeating-linear-gradient(-115deg,rgba(255,255,255,.015) 0 9px,transparent 9px 20px);filter:blur(8px)}
body:after{content:"";position:fixed;inset:7px;border:3px solid var(--heat);border-radius:26px;box-shadow:inset 0 0 30px var(--glow),0 0 34px var(--glow);pointer-events:none;z-index:30;transition:.25s ease}
.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;gap:9px;padding:max(11px,env(safe-area-inset-top)) 11px max(11px,env(safe-area-inset-bottom));position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center}.back,.reset,.navbtn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);padding:9px 13px;border-radius:999px;font-weight:800;text-decoration:none;font-size:.82rem;cursor:pointer}.reset{color:var(--gold2)}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.step{height:5px;border-radius:999px;background:rgba(255,255,255,.07)}.step.on{background:var(--heat);box-shadow:0 0 9px var(--glow)}
.panel{min-height:0;border:1px solid var(--line);background:linear-gradient(160deg,rgba(29,6,9,.96),rgba(10,2,3,.985));border-radius:27px;box-shadow:0 24px 64px rgba(0,0,0,.42);padding:16px;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}.head{text-align:center}.eyebrow{font-size:.67rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2);font-weight:850}.title{margin:5px 0 3px;font-size:clamp(1.75rem,6vw,3rem);letter-spacing:-.045em;line-height:.95}.sub{margin:0;color:var(--muted);font-size:.8rem;line-height:1.35}
.cards{display:flex;justify-content:center;gap:7px;margin:12px 0 10px}.slot{width:min(16vw,66px);height:min(21vw,89px);min-width:45px;min-height:62px;border-radius:15px;border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.025);display:grid;place-items:center;color:rgba(255,255,255,.28);font-weight:900;position:relative;cursor:pointer}.slot.filled{background:linear-gradient(145deg,#fffdf8,#e8e0d6);color:#171214;border:1px solid rgba(0,0,0,.2);box-shadow:0 10px 24px rgba(0,0,0,.23);font-size:1.08rem}.slot.red{color:#b7132a}.slot.active{outline:2px solid var(--gold);outline-offset:3px}.slot small{position:absolute;bottom:4px;font-size:.48rem;opacity:.55;color:inherit}
.content{min-height:0;display:grid;grid-template-columns:.82fr 1.18fr;gap:11px}.picker,.journey{min-height:0;border-radius:20px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.06);padding:13px;overflow:hidden}.question{font-size:1.06rem;font-weight:900}.hint{color:var(--muted);font-size:.74rem;margin-top:3px}.rankgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}.rank,.suit{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-weight:900;border-radius:13px;padding:10px 4px;cursor:pointer}.suitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}.suit{font-size:1.5rem;padding:16px 4px}.suit.red{color:#ff7a90}.suit:disabled{opacity:.16}
.journey{display:grid;grid-template-rows:auto auto 1fr;gap:9px}.journeyTitle{font-size:.67rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:850}.path{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}.state{padding:12px;border-radius:17px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}.state.now{background:radial-gradient(circle at top right,var(--glow),transparent 58%),rgba(255,255,255,.03)}.stateLabel{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.state b{display:block;margin-top:4px;font-size:1rem}.state p{margin:4px 0 0;color:var(--muted);font-size:.69rem;line-height:1.35}.arrow{display:grid;place-items:center;color:var(--gold2);font-size:1.2rem}
.combo{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.miniCard{width:31px;height:42px;border-radius:8px;background:linear-gradient(145deg,#fffdf8,#e9e1d8);color:#171214;border:1px solid rgba(0,0,0,.2);display:grid;place-items:center;font-weight:900;font-size:.72rem;box-shadow:0 5px 12px rgba(0,0,0,.18)}.miniCard.red{color:#b7132a}.miniCard.need{background:transparent;color:var(--gold2);border:1px dashed rgba(216,181,109,.55);box-shadow:none;font-size:.62rem;text-align:center;padding:2px}
.options{min-height:0;display:grid;align-content:start;gap:6px;overflow:auto;padding-right:2px}.option{padding:9px 10px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.option b{font-size:.8rem}.option span{display:block;color:var(--muted);font-size:.66rem;margin-top:2px;line-height:1.3}.chance{font-size:.76rem;font-weight:900;color:var(--gold2);white-space:nowrap}.empty{color:var(--muted);font-size:.74rem;text-align:center;padding:10px}
.bottom{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;padding:9px 11px;border:1px solid rgba(255,255,255,.08);border-radius:19px;background:radial-gradient(circle at right,var(--glow),transparent 52%),rgba(255,255,255,.03);box-shadow:0 0 18px var(--glow)}.heatlabel{font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);font-weight:850}.heatmain{font-size:.92rem;font-weight:900;margin-top:2px}.heatsub{color:var(--muted);font-size:.67rem;margin-top:1px}.nav{display:flex;gap:7px}.navbtn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1e0b03;border-color:transparent}.navbtn:disabled{opacity:.28}.hidden{display:none!important}
@media(max-width:720px){.panel{padding:13px;border-radius:23px}.content{grid-template-columns:1fr;grid-template-rows:auto 1fr}.picker{padding:11px}.journey{padding:11px}.rankgrid{grid-template-columns:repeat(7,1fr);gap:5px}.rank{padding:8px 2px;font-size:.77rem}.suit{padding:12px 2px}.path{gap:6px}.state{padding:9px}.state b{font-size:.88rem}.state p{font-size:.61rem}.miniCard{width:27px;height:37px;font-size:.65rem}.options{grid-template-columns:repeat(2,1fr);gap:5px}.option{grid-template-columns:1fr;padding:7px}.chance{font-size:.68rem}.cards{margin:9px 0}.slot{width:min(14vw,56px);height:min(18vw,75px)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><a class="back" href="./">← Home</a><button class="reset" id="reset">New Hand</button></div>
<div class="progress" id="progress"></div>
<section class="panel">
<div class="head"><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><p class="sub" id="sub"></p></div>
<div class="cards" id="cards"></div>
<div class="content">
<div class="picker"><div class="question" id="question"></div><div class="hint" id="hint"></div><div id="rankGrid" class="rankgrid"></div><div id="suitGrid" class="suitgrid hidden"></div></div>
<div class="journey"><div class="journeyTitle">See the actual combination</div><div class="path"><div class="state now"><div class="stateLabel">You are here</div><b id="nowHand">Nothing yet</b><div class="combo" id="nowCombo"></div><p id="nowExplain">Enter your cards and this will show which cards make your hand.</p></div><div class="arrow">→</div><div class="state"><div class="stateLabel">Best next direction</div><b id="nextBest">Waiting</b><div class="combo" id="nextCombo"></div><p id="nextExplain">The cards building your next hand will appear here.</p></div></div><div class="options" id="options"></div></div>
</div>
</section>
<div class="bottom"><div><div class="heatlabel">Hand Heat</div><div class="heatmain" id="heatMain">WAITING FOR CARDS</div><div class="heatsub" id="heatSub">Enter your two cards.</div></div><div class="nav"><button class="navbtn" id="back">Back</button><button class="navbtn primary" id="next">Next</button></div></div>
</div>
<script>
const SUITS=[['♠','s'],['♥','h'],['♦','d'],['♣','c']],RANKS=[['A',14],['K',13],['Q',12],['J',11],['10',10],['9',9],['8',8],['7',7],['6',6],['5',5],['4',4],['3',3],['2',2]];
const PAGES=[{name:'YOUR CARDS',idx:[0,1],title:'Your two cards',sub:'Start with the cards in your hand.'},{name:'FLOP',idx:[2,3,4],title:'Add the flop',sub:'Enter the first three cards on the table.'},{name:'TURN',idx:[5],title:'Add the turn',sub:'Enter the fourth community card.'},{name:'RIVER',idx:[6],title:'Add the river',sub:'Enter the final community card.'},{name:'RESULT',idx:[],title:'Your final hand',sub:'See exactly which cards made your final combination.'}];
let cards=Array(7).fill(null),page=0,active=0,pending=null,phase='rank';
const COLORS={risk:['#650915','rgba(101,9,21,.55)'],caution:['#a84318','rgba(168,67,24,.52)'],possible:['#b87b1d','rgba(184,123,29,.5)'],strong:['#b91e31','rgba(185,30,49,.55)'],monster:['#d8b56d','rgba(216,181,109,.58)']};
const lab=r=>RANKS.find(x=>x[1]===r)[0],sym=s=>SUITS.find(x=>x[1]===s)[0];
function cardText(c){return `${lab(c.r)}${sym(c.s)}`}
function mini(c,extra=''){if(!c)return `<div class="miniCard need">${extra}</div>`;return `<div class="miniCard ${c.s==='h'||c.s==='d'?'red':''}">${cardText(c)}</div>`}
function setHeat(k){const c=COLORS[k];document.documentElement.style.setProperty('--heat',c[0]);document.documentElement.style.setProperty('--glow',c[1])}
function used(r,s,ignore=active){return cards.some((c,i)=>i!==ignore&&c&&c.r===r&&c.s===s)}function complete(){return PAGES[page].idx.every(i=>cards[i])}function firstMissing(){return PAGES[page].idx.find(i=>!cards[i])}
function combos(a,k){const o=[];function rec(s,p){if(p.length===k){o.push([...p]);return}for(let i=s;i<a.length;i++){p.push(a[i]);rec(i+1,p);p.pop()}}rec(0,[]);return o}
function eval5(c){const rs=c.map(x=>x.r).sort((a,b)=>b-a),cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);const flush=c.every(x=>x.s===c[0].s);let u=[...new Set(rs)];if(u.includes(14))u.push(1);u=[...new Set(u)].sort((a,b)=>b-a);let st=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){st=u[i];break}const g=Object.entries(cnt).map(([r,n])=>({r:+r,n})).sort((a,b)=>b.n-a.n||b.r-a.r);if(flush&&st===14)return{rank:9,name:'Royal Flush'};if(flush&&st)return{rank:8,name:'Straight Flush'};if(g[0].n===4)return{rank:7,name:'Four of a Kind'};if(g[0].n===3&&g[1].n===2)return{rank:6,name:'Full House'};if(flush)return{rank:5,name:'Flush'};if(st)return{rank:4,name:'Straight'};if(g[0].n===3)return{rank:3,name:'Three of a Kind'};if(g[0].n===2&&g[1]&&g[1].n===2)return{rank:2,name:'Two Pair'};if(g[0].n===2)return{rank:1,name:'One Pair'};return{rank:0,name:'High Card'}}
function bestInfo(a){if(a.length>=5){let best={rank:-1,name:'',combo:[]};for(const c of combos(a,5)){const e=eval5(c);if(e.rank>best.rank)best={...e,combo:c}}return best}const cnt={};a.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);const groups=Object.entries(cnt).map(([r,n])=>({r:+r,n})).sort((x,y)=>y.n-x.n||y.r-x.r);if(groups[0]?.n===4)return{rank:7,name:'Four of a Kind',combo:a.filter(c=>c.r===groups[0].r)};if(groups[0]?.n===3)return{rank:3,name:'Three of a Kind',combo:a.filter(c=>c.r===groups[0].r)};const pairs=groups.filter(g=>g.n===2);if(pairs.length>=2)return{rank:2,name:'Two Pair',combo:a.filter(c=>pairs.slice(0,2).some(p=>p.r===c.r))};if(pairs.length===1)return{rank:1,name:'One Pair',combo:a.filter(c=>c.r===pairs[0].r)};const high=[...a].sort((x,y)=>y.r-x.r)[0];return{rank:0,name:'High Card',combo:high?[high]:[]}}
function explain(h){return{0:'Your highest card is the only made value right now.',1:'These matching cards are your pair.',2:'These four cards make your two pairs.',3:'These three matching cards make your trips.',4:'These five cards connect in number order.',5:'These five cards share the same suit.',6:'These five cards make three of one rank plus a pair.',7:'These four matching cards make quads.',8:'These five cards are consecutive and the same suit.',9:'A-K-Q-J-10 in one suit — the best possible hand.'}[h.rank]}
function paths(a){if(a.length<2||a.length>=7)return[];const out=[],unseen=52-a.length,sc={s:0,h:0,d:0,c:0};a.forEach(c=>sc[c.s]++);for(const [s,n] of Object.entries(sc))if(n===4){const related=a.filter(c=>c.s===s);out.push({name:'Flush',power:5,outs:9,pct:Math.round(9/unseen*100),detail:`One more ${sym(s)} completes it.`,combo:related,need:`Any ${sym(s)}`})}let rs=[...new Set(a.map(c=>c.r))];if(rs.includes(14))rs.push(1);rs=[...new Set(rs)].sort((x,y)=>x-y);for(let st=1;st<=10;st++){const seq=[st,st+1,st+2,st+3,st+4],miss=seq.filter(r=>!rs.includes(r));if(miss.length===1){const need=miss[0]===1?14:miss[0],related=a.filter(c=>seq.includes(c.r)||(c.r===14&&seq.includes(1)));out.push({name:'Straight',power:4,outs:4,pct:Math.round(4/unseen*100),detail:`A ${lab(need)} completes it.`,combo:related,need:lab(need)});break}}
const cnt={};a.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);for(const [r,n] of Object.entries(cnt)){const rr=+r,related=a.filter(c=>c.r===rr);if(n===2)out.push({name:'Three of a Kind',power:3,outs:2,pct:Math.round(2/unseen*100),detail:`Another ${lab(rr)} makes trips.`,combo:related,need:lab(rr)});if(n===3)out.push({name:'Four of a Kind',power:7,outs:1,pct:Math.round(1/unseen*100),detail:`The last ${lab(rr)} makes quads.`,combo:related,need:lab(rr)})}
const pairs=Object.entries(cnt).filter(([,n])=>n===2).map(([r])=>+r),singles=Object.entries(cnt).filter(([,n])=>n===1).map(([r])=>+r);if(pairs.length&&singles.length){const target=singles.sort((a,b)=>b-a)[0],related=a.filter(c=>c.r===pairs[0]||c.r===target);out.push({name:'Two Pair',power:2,outs:3,pct:Math.round(3/unseen*100),detail:`Pairing your ${lab(target)} makes two pair.`,combo:related,need:lab(target)})}if(Object.values(cnt).includes(3)&&singles.length){const trips=+Object.entries(cnt).find(([,n])=>n===3)[0],target=singles.sort((a,b)=>b-a)[0],related=a.filter(c=>c.r===trips||c.r===target);out.push({name:'Full House',power:6,outs:3,pct:Math.round(3/unseen*100),detail:`Pairing your ${lab(target)} fills the house.`,combo:related,need:lab(target)})}
const seen=new Set();return out.filter(x=>!seen.has(x.name)&&seen.add(x.name)).sort((a,b)=>b.power-a.power||b.outs-a.outs)}
function analyze(){const a=cards.filter(Boolean);if(a.length<2){setHeat('risk');return{hand:{rank:0,name:'Nothing yet',combo:[]},paths:[],level:'risk',label:'WAITING FOR CARDS',sub:'Enter your two cards.'}}const hand=bestInfo(a),ps=paths(a);let level='risk',label='HIGH RISK';if(hand.rank>=6){level='monster';label='MONSTER'}else if(hand.rank>=2){level='strong';label='STRONG'}else if(hand.rank===1){level='caution';label='CAUTION'}else if(ps.some(x=>x.outs>=8)){level='possible';label='POSSIBLE'}setHeat(level);return{hand,paths:ps,level,label:`${hand.name.toUpperCase()} — ${label}`,sub:ps[0]?`${ps[0].name} is your strongest next direction.`:'No major improvement is one card away.'}}
function render(){const info=analyze();document.getElementById('progress').innerHTML=PAGES.map((_,i)=>`<div class="step ${i<=page?'on':''}"></div>`).join('');document.getElementById('eyebrow').textContent=`STEP ${page+1} OF 5 • ${PAGES[page].name}`;document.getElementById('title').textContent=PAGES[page].title;document.getElementById('sub').textContent=PAGES[page].sub;document.getElementById('heatMain').textContent=info.label;document.getElementById('heatSub').textContent=info.sub;renderCards();renderPicker();renderJourney(info);document.getElementById('back').disabled=page===0&&phase==='rank';document.getElementById('next').disabled=page<4&&!complete();document.getElementById('next').textContent=page===4?'New Hand':'Next'}
function renderCards(){const ids=page===4?[0,1,2,3,4,5,6]:PAGES[page].idx;const labels=['You 1','You 2','Flop 1','Flop 2','Flop 3','Turn','River'];document.getElementById('cards').innerHTML=ids.map(i=>{const c=cards[i];return `<button class="slot ${c?'filled':''} ${c&&(c.s==='h'||c.s==='d')?'red':''} ${i===active&&page<4?'active':''}" onclick="selectSlot(${i})">${c?cardText(c):'+'}<small>${labels[i]}</small></button>`}).join('')}
function renderPicker(){const rg=document.getElementById('rankGrid'),sg=document.getElementById('suitGrid');if(page===4){document.querySelector('.picker').classList.add('hidden');return}document.querySelector('.picker').classList.remove('hidden');const qs=['Pick your FIRST card','Pick your SECOND card','Pick FLOP card 1','Pick FLOP card 2','Pick FLOP card 3','Pick the TURN card','Pick the RIVER card'];document.getElementById('question').textContent=qs[active];document.getElementById('hint').textContent=phase==='rank'?'Tap the number or letter on the card.':'Now tap its suit.';rg.classList.toggle('hidden',phase!=='rank');sg.classList.toggle('hidden',phase!=='suit');rg.innerHTML=RANKS.map(([l,v])=>`<button class="rank" onclick="pickRank(${v})">${l}</button>`).join('');if(phase==='suit')sg.innerHTML=SUITS.map(([u,v])=>`<button class="suit ${v==='h'||v==='d'?'red':''}" ${used(pending,v)?'disabled':''} onclick="pickSuit('${v}')">${u}</button>`).join('')}
function renderJourney(info){document.getElementById('nowHand').textContent=info.hand.name;document.getElementById('nowExplain').textContent=info.hand.name==='Nothing yet'?'Enter your cards and the exact combination will appear here.':explain(info.hand);document.getElementById('nowCombo').innerHTML=info.hand.combo.map(c=>mini(c)).join('');const best=info.paths[0];if(best){document.getElementById('nextBest').textContent=best.name;document.getElementById('nextExplain').textContent=`${best.detail} About ${best.pct}% on the next card.`;document.getElementById('nextCombo').innerHTML=best.combo.map(c=>mini(c)).join('')+mini(null,best.need)}else{document.getElementById('nextBest').textContent=cards.filter(Boolean).length>=7?'Final hand':'No clear one-card jump';document.getElementById('nextExplain').textContent=cards.filter(Boolean).length>=7?'The hand is complete.':'Nothing major is one card away right now.';document.getElementById('nextCombo').innerHTML=''}document.getElementById('options').innerHTML=info.paths.slice(1,5).map(p=>`<div class="option"><div><b>${p.name}</b><span>${p.detail}</span></div><div class="chance">~${p.pct}%</div></div>`).join('')||`<div class="empty">Other realistic improvements will appear here.</div>`}
function selectSlot(i){if(page===4)return;active=i;pending=null;phase='rank';render()}function pickRank(r){pending=r;phase='suit';renderPicker()}function pickSuit(s){if(used(pending,s))return;cards[active]={r:pending,s};pending=null;phase='rank';const miss=firstMissing();if(miss!==undefined)active=miss;render()}
document.getElementById('next').onclick=()=>{if(page===4){resetHand();return}if(!complete())return;page++;active=page<4?(firstMissing()??PAGES[page].idx[0]):0;phase='rank';pending=null;render()};document.getElementById('back').onclick=()=>{if(phase==='suit'){phase='rank';pending=null}else if(page>0){page--;active=PAGES[page].idx[0]}render()};function resetHand(){cards=Array(7).fill(null);page=0;active=0;pending=null;phase='rank';render()}document.getElementById('reset').onclick=resetHand;render();
</script>
</body>
</html>
