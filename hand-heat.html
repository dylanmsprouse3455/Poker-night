<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090102"><title>Hand Heat • Poker Night</title><style>:root{--text:#fff7f8;--muted:#caaeb5;--line:rgba(255,255,255,.1);--gold:#e3bd72;--gold2:#ffe2a5;--heat:#6a0a16;--glow:rgba(106,10,22,.62)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(circle at 80% 0,rgba(194,22,50,.2),transparent 30%),linear-gradient(180deg,#050102,#110204 48%,#060102)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 8px,transparent 8px 18px),repeating-linear-gradient(-115deg,rgba(255,255,255,.018) 0 10px,transparent 10px 22px);filter:blur(7px)}body:after{content:"";position:fixed;inset:6px;border:4px solid var(--heat);border-radius:24px;box-shadow:inset 0 0 34px var(--glow),0 0 38px var(--glow);pointer-events:none;z-index:50;transition:.25s}.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:max(10px,env(safe-area-inset-top)) 9px max(10px,env(safe-area-inset-bottom));position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:center}.back,.reset{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:8px 11px;border-radius:999px;font-weight:850;text-decoration:none;font-size:.82rem}.reset{cursor:pointer}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.step{height:6px;border-radius:999px;background:rgba(255,255,255,.08)}.step.on{background:var(--heat);box-shadow:0 0 10px var(--glow)}.screen{min-height:0;border:1px solid var(--line);background:linear-gradient(155deg,rgba(38,7,12,.96),rgba(12,2,4,.985));border-radius:22px;padding:12px;box-shadow:0 20px 52px rgba(0,0,0,.42);display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}.eyebrow{color:var(--gold2);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900}.title{margin:3px 0 2px;font-size:clamp(1.5rem,6vw,2.5rem);line-height:.95;letter-spacing:-.04em}.sub{margin:0;color:var(--muted);font-size:.78rem}.cards{display:flex;justify-content:center;gap:6px;margin:9px 0 7px}.slot{width:min(16vw,62px);height:min(20vw,82px);min-width:42px;min-height:58px;border-radius:12px;border:1px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.035);display:grid;place-items:center;color:rgba(255,255,255,.34);font-weight:950;position:relative;cursor:pointer}.slot.filled{background:linear-gradient(145deg,#fffaf4,#e8ded2);color:#171214;border:1px solid rgba(0,0,0,.25);box-shadow:0 8px 18px rgba(0,0,0,.2);font-size:1.05rem}.slot.red{color:#b10f25}.slot.active{outline:3px solid var(--gold);outline-offset:2px}.slot small{position:absolute;bottom:3px;font-size:.48rem;color:inherit;opacity:.68}.work{min-height:0;display:grid;grid-template-columns:1.15fr .85fr;gap:8px}.picker,.answer{min-height:0;padding:10px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);overflow:hidden}.bigq{font-size:1.05rem;font-weight:950}.hint{color:var(--muted);font-size:.71rem;margin-top:2px}.rankgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.rank,.suit{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font-weight:950;border-radius:10px;padding:8px 2px;cursor:pointer}.suitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.suit{font-size:1.45rem;padding:14px 2px}.suit.red{color:#ff7d91}.suit:disabled{opacity:.18}.answer{display:grid;align-content:start;gap:7px}.answerTitle{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:900}.have{padding:9px;border-radius:13px;background:radial-gradient(circle at right,var(--glow),transparent 55%),rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}.have b{display:block;font-size:1rem}.have span{display:block;color:var(--muted);font-size:.7rem;margin-top:2px}.possible{display:grid;gap:5px}.poss{padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}.poss b{display:block;font-size:.78rem}.poss span{display:block;color:var(--muted);font-size:.64rem;margin-top:1px;line-height:1.25}.empty{color:var(--muted);font-size:.72rem;padding:8px;text-align:center}.bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.08);background:radial-gradient(circle at right,var(--glow),transparent 50%),rgba(255,255,255,.035);border-radius:17px;padding:8px 10px}.label{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:900}.heatmain{font-size:.9rem;font-weight:950}.heatsub{font-size:.66rem;color:var(--muted);margin-top:1px}.nav{display:flex;gap:6px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:8px 11px;border-radius:999px;font-weight:850;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1d0a03;border-color:transparent}.btn:disabled{opacity:.28}.hidden{display:none!important}@media(max-width:700px){.work{grid-template-columns:1fr;grid-template-rows:1fr auto}.answer{max-height:29vh}.possible{grid-template-columns:repeat(2,1fr)}.screen{padding:10px}.slot{width:min(15vw,56px);height:min(19vw,74px)}.rankgrid{grid-template-columns:repeat(4,1fr)}.rank{padding:7px 2px}.suit{padding:12px 2px}.title{font-size:1.65rem}}</style></head><body><div class="app"><div class="top"><a class="back" href="./">← Home</a><button class="reset" id="reset">New Hand</button></div><div class="steps" id="steps"></div><section class="screen"><div><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><p class="sub" id="sub"></p></div><div class="cards" id="cards"></div><div class="work"><div class="picker"><div class="bigq" id="question"></div><div class="hint" id="hint"></div><div id="rankGrid" class="rankgrid"></div><div id="suitGrid" class="suitgrid hidden"></div></div><div class="answer"><div class="answerTitle">What you have</div><div class="have"><b id="have">Nothing yet</b><span id="haveDetail">Pick your cards and this updates automatically.</span></div><div class="answerTitle">What you can make next</div><div class="possible" id="possible"></div></div></div></section><div class="bottom"><div><div class="label">Hand Heat</div><div class="heatmain" id="heatMain">WAITING FOR CARDS</div><div class="heatsub" id="heatSub">Enter your two cards.</div></div><div class="nav"><button class="btn" id="back">Back</button><button class="btn primary" id="next">Next</button></div></div></div><script>const SUITS=[['♠','s'],['♥','h'],['♦','d'],['♣','c']],RANKS=[['A',14],['K',13],['Q',12],['J',11],['10',10],['9',9],['8',8],['7',7],['6',6],['5',5],['4',4],['3',3],['2',2]],PAGES=[{name:'YOUR CARDS',idx:[0,1],title:'Your 2 cards',sub:'Put in the two cards you are holding.'},{name:'FLOP',idx:[2,3,4],title:'The first 3 cards',sub:'Put in the three cards that were laid down.'},{name:'TURN',idx:[5],title:'The 4th table card',sub:'Put in the next card.'},{name:'RIVER',idx:[6],title:'The last table card',sub:'Put in the final card.'},{name:'DONE',idx:[],title:'Your final hand',sub:'This is what you ended with.'}];let cards=Array(7).fill(null),page=0,active=0,pending=null,phase='rank';const COLORS={risk:['#650915','rgba(101,9,21,.68)'],caution:['#b64418','rgba(182,68,24,.64)'],possible:['#d28c1e','rgba(210,140,30,.62)'],strong:['#d52235','rgba(213,34,53,.65)'],monster:['#e3bd72','rgba(227,189,114,.72)']};const lab=r=>RANKS.find(x=>x[1]===r)[0],sym=s=>SUITS.find(x=>x[1]===s)[0];function setHeat(k){const c=COLORS[k];document.documentElement.style.setProperty('--heat',c[0]);document.documentElement.style.setProperty('--glow',c[1])}function used(r,s,ignore=active){return cards.some((c,i)=>i!==ignore&&c&&c.r===r&&c.s===s)}function complete(){return PAGES[page].idx.every(i=>cards[i])}function firstMissing(){return PAGES[page].idx.find(i=>!cards[i])}function combos(a,k){const o=[];function rec(s,p){if(p.length===k){o.push([...p]);return}for(let i=s;i<a.length;i++){p.push(a[i]);rec(i+1,p);p.pop()}}rec(0,[]);return o}function eval5(c){const rs=c.map(x=>x.r).sort((a,b)=>b-a),cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);const flush=c.every(x=>x.s===c[0].s);let u=[...new Set(rs)];if(u.includes(14))u.push(1);u=[...new Set(u)].sort((a,b)=>b-a);let st=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){st=u[i];break}const g=Object.entries(cnt).map(([r,n])=>({r:+r,n})).sort((a,b)=>b.n-a.n||b.r-a.r);if(flush&&st===14)return{rank:9,name:'Royal Flush'};if(flush&&st)return{rank:8,name:'Straight Flush'};if(g[0].n===4)return{rank:7,name:'Four of a Kind'};if(g[0].n===3&&g[1].n===2)return{rank:6,name:'Full House'};if(flush)return{rank:5,name:'Flush'};if(st)return{rank:4,name:'Straight'};if(g[0].n===3)return{rank:3,name:'Three of a Kind'};if(g[0].n===2&&g[1]&&g[1].n===2)return{rank:2,name:'Two Pair'};if(g[0].n===2)return{rank:1,name:'One Pair'};return{rank:0,name:'High Card'}}function bestHand(a){if(a.length<5){const c={};a.forEach(x=>c[x.r]=(c[x.r]||0)+1);const v=Object.values(c);if(v.includes(4))return{rank:7,name:'Four of a Kind'};if(v.includes(3)&&v.includes(2))return{rank:6,name:'Full House'};if(v.includes(3))return{rank:3,name:'Three of a Kind'};if(v.filter(x=>x===2).length>=2)return{rank:2,name:'Two Pair'};if(v.includes(2))return{rank:1,name:'One Pair'};return{rank:0,name:'High Card'}}let b={rank:-1,name:''};for(const c of combos(a,5)){const e=eval5(c);if(e.rank>b.rank)b=e}return b}function paths(a){if(a.length<2||a.length>=7)return[];const out=[],unseen=52-a.length,sc={s:0,h:0,d:0,c:0};a.forEach(c=>sc[c.s]++);for(const [s,n] of Object.entries(sc))if(n===4)out.push({name:'Flush',outs:9,detail:`9 ${sym(s)} cards help`,pct:Math.round(9/unseen*100)});let rs=[...new Set(a.map(c=>c.r))];if(rs.includes(14))rs.push(1);rs=[...new Set(rs)].sort((x,y)=>x-y);for(let st=1;st<=10;st++){const seq=[st,st+1,st+2,st+3,st+4],miss=seq.filter(r=>!rs.includes(r));if(miss.length===1){out.push({name:'Straight',outs:4,detail:`Need ${lab(miss[0]===1?14:miss[0])}`,pct:Math.round(4/unseen*100)});break}}const cnt={};a.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);for(const [r,n] of Object.entries(cnt)){const rr=+r;if(n===1)out.push({name:`Pair of ${lab(rr)}s`,outs:3,detail:'3 cards can pair it',pct:Math.round(3/unseen*100)});if(n===2)out.push({name:'Three of a Kind',outs:2,detail:`2 ${lab(rr)}s left`,pct:Math.round(2/unseen*100)});if(n===3)out.push({name:'Four of a Kind',outs:1,detail:`1 ${lab(rr)} left`,pct:Math.round(1/unseen*100)})}const vals=Object.values(cnt);if(vals.includes(2)&&vals.includes(1))out.push({name:'Two Pair',outs:3,detail:'Pair another rank',pct:Math.round(3/unseen*100)});if(vals.includes(3)&&vals.includes(1))out.push({name:'Full House',outs:3,detail:'Pair another rank',pct:Math.round(3/unseen*100)});const seen=new Set();return out.filter(x=>!seen.has(x.name)&&seen.add(x.name)).sort((a,b)=>b.outs-a.outs).slice(0,4)}function analyze(){const a=cards.filter(Boolean);if(a.length<2){setHeat('risk');return{hand:'Nothing yet',main:'WAITING FOR CARDS',sub:'Enter your two cards.',paths:[]}}const h=bestHand(a),p=paths(a);let level='risk',label='HIGH RISK';if(h.rank>=6){level='monster';label='MONSTER'}else if(h.rank>=2){level='strong';label='STRONG'}else if(h.rank===1){level='caution';label='CAUTION'}else if(p.some(x=>x.outs>=8)){level='possible';label='POSSIBLE'}setHeat(level);return{hand:h.name,main:`${h.name.toUpperCase()} — ${label}`,sub:p.length?'You still have ways to improve.':'No obvious next-card improvement.',paths:p}}function qText(i){return['Pick your FIRST card','Pick your SECOND card','Pick FLOP card 1','Pick FLOP card 2','Pick FLOP card 3','Pick the TURN card','Pick the RIVER card'][i]}function render(){const a=analyze();document.getElementById('steps').innerHTML=PAGES.map((_,i)=>`<div class="step ${i<=page?'on':''}"></div>`).join('');document.getElementById('eyebrow').textContent=`STEP ${page+1} OF 5 • ${PAGES[page].name}`;document.getElementById('title').textContent=PAGES[page].title;document.getElementById('sub').textContent=PAGES[page].sub;const ids=page===4?[0,1,2,3,4,5,6]:PAGES[page].idx,labels=['Me 1','Me 2','Flop 1','Flop 2','Flop 3','Turn','River'];document.getElementById('cards').innerHTML=ids.map(i=>{const c=cards[i],red=c&&(c.s==='h'||c.s==='d');return `<button class="slot ${c?'filled':''} ${red?'red':''} ${i===active&&page<4?'active':''}" onclick="selectSlot(${i})">${c?lab(c.r)+sym(c.s):'+'}<small>${labels[i]}</small></button>`}).join('');const rg=document.getElementById('rankGrid'),sg=document.getElementById('suitGrid');if(page===4){document.getElementById('question').textContent='All done';document.getElementById('hint').textContent='Your final hand is shown on the right.';rg.classList.add('hidden');sg.classList.add('hidden')}else{document.getElementById('question').textContent=qText(active);document.getElementById('hint').textContent=phase==='rank'?'1. Tap the big letter/number on the card.':'2. Tap the suit symbol.';rg.classList.toggle('hidden',phase!=='rank');sg.classList.toggle('hidden',phase!=='suit');rg.innerHTML=RANKS.map(([l,v])=>`<button class="rank" onclick="pickRank(${v})">${l}</button>`).join('');if(phase==='suit')sg.innerHTML=SUITS.map(([u,v])=>`<button class="suit ${v==='h'||v==='d'?'red':''}" ${used(pending,v)?'disabled':''} onclick="pickSuit('${v}')">${u}</button>`).join('')}document.getElementById('have').textContent=a.hand;document.getElementById('haveDetail').textContent=cards.filter(Boolean).length<2?'Pick your two cards first.':`Using ${cards.filter(Boolean).length} known card${cards.filter(Boolean).length===1?'':'s'}.`;document.getElementById('possible').innerHTML=a.paths.length?a.paths.map(x=>`<div class="poss"><b>${x.name} • ${x.outs} out${x.outs===1?'':'s'} • ~${x.pct}%</b><span>${x.detail}</span></div>`).join(''):'<div class="empty">Nothing obvious to chase right now.</div>';document.getElementById('heatMain').textContent=a.main;document.getElementById('heatSub').textContent=a.sub;document.getElementById('back').disabled=page===0&&phase==='rank';document.getElementById('next').textContent=page===4?'New Hand':'Next';document.getElementById('next').disabled=page<4&&!complete()}function selectSlot(i){if(page===4)return;active=i;pending=null;phase='rank';render()}function pickRank(r){pending=r;phase='suit';render()}function pickSuit(s){if(used(pending,s))return;cards[active]={r:pending,s};pending=null;phase='rank';const m=firstMissing();if(m!==undefined)active=m;render()}document.getElementById('next').onclick=()=>{if(page===4){cards=Array(7).fill(null);page=0;active=0;pending=null;phase='rank';render();return}if(!complete())return;page++;active=page<4?(firstMissing()??PAGES[page].idx[0]):0;pending=null;phase='rank';render()};document.getElementById('back').onclick=()=>{if(phase==='suit'){phase='rank';pending=null;render();return}if(page>0){page--;active=PAGES[page].idx[0];render()}};document.getElementById('reset').onclick=()=>{cards=Array(7).fill(null);page=0;active=0;pending=null;phase='rank';render()};render();</script></body></html>
