<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090102">
<title>Hand Heat • Poker Night</title>
<style>
:root{--text:#fff5f6;--muted:#c8abb2;--line:rgba(255,255,255,.1);--gold:#e0b96d;--gold2:#f5daa0;--heat:#7b0b19;--heatGlow:rgba(123,11,25,.65)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 80% 0,rgba(194,22,50,.18),transparent 30%),linear-gradient(180deg,#050102,#110204 48%,#060102)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.27;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 8px,transparent 8px 18px),repeating-linear-gradient(-115deg,rgba(255,255,255,.018) 0 10px,transparent 10px 22px);filter:blur(7px)}
body:after{content:"";position:fixed;inset:7px;border:4px solid var(--heat);border-radius:26px;box-shadow:inset 0 0 40px var(--heatGlow),0 0 42px var(--heatGlow);pointer-events:none;z-index:60;transition:.25s ease}.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));position:relative;z-index:1}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.back{color:var(--gold2);text-decoration:none;font-weight:850;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:.88rem}.modeBtns{display:flex;gap:7px}.modeBtn,.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:9px 12px;border-radius:999px;font-weight:850;cursor:pointer}.modeBtn.active,.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1d0a03;border-color:transparent}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.prog{height:7px;border-radius:999px;background:rgba(255,255,255,.08)}.prog.done,.prog.active{background:var(--heat);box-shadow:0 0 12px var(--heatGlow)}.screen{min-height:0;border:1px solid var(--line);background:linear-gradient(155deg,rgba(38,7,12,.96),rgba(12,2,4,.985));box-shadow:0 22px 58px rgba(0,0,0,.43);border-radius:26px;padding:16px;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}.eyebrow{color:var(--gold2);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:900}.title{margin:5px 0 3px;font-size:clamp(1.65rem,6vw,3rem);line-height:.95;letter-spacing:-.045em}.sub{margin:0;color:var(--muted);font-size:.88rem;line-height:1.35}.cards{display:flex;justify-content:center;gap:8px;margin:12px 0 10px;flex-wrap:nowrap}.slot{width:min(18vw,76px);height:min(24vw,100px);min-width:48px;min-height:68px;border-radius:14px;border:1px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.035);display:grid;place-items:center;color:rgba(255,255,255,.35);font-weight:950;position:relative;cursor:pointer}.slot.filled{background:linear-gradient(145deg,#fffaf4,#e8ded2);color:#171214;border:1px solid rgba(0,0,0,.25);box-shadow:0 10px 20px rgba(0,0,0,.2);font-size:1.18rem}.slot.red{color:#b10f25}.slot.active{outline:3px solid var(--gold);outline-offset:2px}.slot small{position:absolute;bottom:4px;font-size:.55rem;color:inherit;opacity:.72}.wizard{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:8px}.question{font-weight:900;font-size:1.08rem}.helper{color:var(--muted);font-size:.8rem}.chooser{min-height:0;display:grid;align-content:center}.rankgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.rankbtn,.suitbtn{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);font-weight:900;border-radius:12px;padding:11px 4px;cursor:pointer}.rankbtn:disabled,.suitbtn:disabled{opacity:.18;cursor:not-allowed}.suitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.suitbtn{font-size:1.5rem;padding:18px 5px}.suitbtn.red{color:#ff758b}.heatbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.08);background:radial-gradient(circle at right,var(--heatGlow),transparent 48%),rgba(255,255,255,.035);border-radius:20px;padding:10px 12px;box-shadow:0 0 24px var(--heatGlow)}.heatlabel{font-size:.65rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);font-weight:900}.heatmain{font-size:1rem;font-weight:950}.heatsub{font-size:.74rem;color:var(--muted);margin-top:2px}.footerActions{display:flex;gap:8px}.btn:disabled{opacity:.28;cursor:not-allowed}.resultGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:11px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}.stat b{display:block;font-size:1rem}.stat span{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}.possibilities{min-height:0;display:grid;grid-template-rows:auto auto 1fr;gap:10px}.possGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;align-content:start}.poss{padding:12px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}.poss strong{display:block;font-size:.95rem}.poss span{display:block;color:var(--muted);font-size:.78rem;margin-top:4px;line-height:1.35}.poss.hot{border-color:rgba(224,185,109,.28);box-shadow:0 0 20px rgba(224,185,109,.08)}.currentBox{padding:12px;border-radius:16px;background:radial-gradient(circle at right,var(--heatGlow),transparent 55%),rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}.currentBox b{font-size:1.08rem}.currentBox div{color:var(--muted);font-size:.8rem;margin-top:3px}.emptyMsg{color:var(--muted);font-size:.9rem;padding:16px;text-align:center}.hidden{display:none!important}@media(max-width:620px){.app{padding-left:9px;padding-right:9px}.screen{border-radius:22px;padding:14px}.rankgrid{grid-template-columns:repeat(4,1fr);gap:6px}.rankbtn{padding:10px 3px}.suitbtn{padding:16px 4px}.resultGrid{grid-template-columns:1fr}.possGrid{grid-template-columns:1fr}.slot{width:min(17vw,68px);height:min(23vw,90px)}.modeBtn{padding:8px 10px;font-size:.78rem}}
</style>
</head>
<body><div class="app"><div class="topbar"><a class="back" href="./">← Main Page</a><div class="modeBtns"><button class="modeBtn active" id="heatModeBtn">Hand Heat</button><button class="modeBtn" id="possModeBtn">Possibilities</button></div></div><div class="progress" id="progress"></div><section class="screen" id="screen"></section><div class="heatbar"><div><div class="heatlabel">Current Read</div><div class="heatmain" id="heatMain">WAITING FOR CARDS</div><div class="heatsub" id="heatSub">Enter both of your cards to begin.</div></div><div class="footerActions"><button class="btn" id="backBtn">Back</button><button class="btn primary" id="nextBtn">Next</button></div></div></div>
<script>
const suits=[['♠','s'],['♥','h'],['♦','d'],['♣','c']],ranks=[['A',14],['K',13],['Q',12],['J',11],['10',10],['9',9],['8',8],['7',7],['6',6],['5',5],['4',4],['3',3],['2',2]];const pages=[{name:'YOUR CARDS',idx:[0,1],title:'Enter your two cards',sub:'Start with the first card in your hand. We’ll guide you one card at a time.'},{name:'FLOP',idx:[2,3,4],title:'Enter the first three cards',sub:'Add the three community cards that came out on the flop.'},{name:'TURN',idx:[5],title:'Enter the turn card',sub:'Add the fourth community card.'},{name:'RIVER',idx:[6],title:'Enter the river card',sub:'Add the final community card.'},{name:'RESULT',idx:[],title:'Your Hand Heat',sub:'Here is the current read based on all cards entered.'}];
let mode='heat',cards=Array(7).fill(null),page=0,active=0,pendingRank=null,pickMode='rank';const colors={risk:['#640914','rgba(100,9,20,.7)'],caution:['#b84018','rgba(184,64,24,.65)'],possible:['#d08b20','rgba(208,139,32,.62)'],strong:['#d22532','rgba(210,37,50,.66)'],monster:['#e0b96d','rgba(224,185,109,.7)']};const sym=s=>suits.find(x=>x[1]===s)[0],lab=r=>ranks.find(x=>x[1]===r)[0];function used(r,s,ignore=active){return cards.some((c,i)=>i!==ignore&&c&&c.r===r&&c.s===s)}function setHeat(level){const c=colors[level]||colors.risk;document.documentElement.style.setProperty('--heat',c[0]);document.documentElement.style.setProperty('--heatGlow',c[1])}function pageComplete(){return pages[page].idx.every(i=>cards[i])}function firstMissing(){return pages[page].idx.find(i=>!cards[i])}
function combos(a,k){const o=[];function rec(s,p){if(p.length===k){o.push([...p]);return}for(let i=s;i<a.length;i++){p.push(a[i]);rec(i+1,p);p.pop()}}rec(0,[]);return o}
function eval5(c){const rs=c.map(x=>x.r).sort((a,b)=>b-a),cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);const flush=c.every(x=>x.s===c[0].s);let u=[...new Set(rs)];if(u.includes(14))u.push(1);u=[...new Set(u)].sort((a,b)=>b-a);let st=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){st=u[i];break}const g=Object.entries(cnt).map(([r,n])=>({r:+r,n})).sort((a,b)=>b.n-a.n||b.r-a.r);if(flush&&st===14)return{rank:9,name:'Royal Flush'};if(flush&&st)return{rank:8,name:'Straight Flush'};if(g[0].n===4)return{rank:7,name:'Four of a Kind'};if(g[0].n===3&&g[1].n===2)return{rank:6,name:'Full House'};if(flush)return{rank:5,name:'Flush'};if(st)return{rank:4,name:'Straight'};if(g[0].n===3)return{rank:3,name:'Three of a Kind'};if(g[0].n===2&&g[1]&&g[1].n===2)return{rank:2,name:'Two Pair'};if(g[0].n===2)return{rank:1,name:'One Pair'};return{rank:0,name:'High Card'}}
function bestHand(a){if(a.length<5){const c={};a.forEach(x=>c[x.r]=(c[x.r]||0)+1);const v=Object.values(c);if(v.includes(4))return{rank:7,name:'Four of a Kind'};if(v.includes(3)&&v.includes(2))return{rank:6,name:'Full House'};if(v.includes(3))return{rank:3,name:'Three of a Kind'};if(v.filter(x=>x===2).length>=2)return{rank:2,name:'Two Pair'};if(v.includes(2))return{rank:1,name:'One Pair'};return{rank:0,name:'High Card'}}let b={rank:-1,name:''};for(const c of combos(a,5)){const e=eval5(c);if(e.rank>b.rank)b=e}return b}
function drawInfo(a){if(a.length<4)return{draw:'Too early to tell',outs:0,types:[]};const types=[],sc={s:0,h:0,d:0,c:0};a.forEach(c=>sc[c.s]++);const max=Math.max(...Object.values(sc));if(max===4)types.push({name:'Flush draw',outs:9,detail:'One more card of that suit completes a flush.'});let rs=[...new Set(a.map(c=>c.r))];if(rs.includes(14))rs.push(1);rs=[...new Set(rs)].sort((a,b)=>a-b);let open=false,gut=false;for(let st=1;st<=10;st++){const q=[st,st+1,st+2,st+3,st+4],hit=q.filter(r=>rs.includes(r));if(hit.length===4){const m=q.find(r=>!rs.includes(r));if(m===st||m===st+4)open=true;else gut=true}}if(open)types.push({name:'Open-ended straight draw',outs:8,detail:'Either end of the sequence can complete your straight.'});else if(gut)types.push({name:'Gutshot straight draw',outs:4,detail:'One specific rank completes your straight.'});return{draw:types.length?types.map(x=>x.name).join(' + '):'No major draw',outs:types.length?Math.max(...types.map(x=>x.outs)):0,types}}
function pairPaths(a){const cnt={};a.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);const out=[];for(const [r,n] of Object.entries(cnt)){const rank=+r;if(n===1)out.push({name:`Pair of ${lab(rank)}s possible`,outs:3,detail:`Three unseen ${lab(rank)}s can pair this rank.`});if(n===2)out.push({name:`Three of a Kind possible`,outs:2,detail:`Two unseen ${lab(rank)}s can turn your pair into trips.`});if(n===3)out.push({name:`Four of a Kind possible`,outs:1,detail:`One unseen ${lab(rank)} can make quads.`})}const pairs=Object.values(cnt).filter(n=>n===2).length;if(pairs>=1&&Object.values(cnt).some(n=>n===1))out.push({name:'Two Pair possible',outs:3,detail:'Pairing one of your other ranks can make two pair.'});if(Object.values(cnt).some(n=>n===3)&&Object.values(cnt).some(n=>n===1))out.push({name:'Full House possible',outs:3,detail:'Pairing another rank can fill up your trips.'});return out}
function possibilities(a){if(a.length<2)return[];const h=bestHand(a),d=drawInfo(a),raw=[...d.types,...pairPaths(a)];const seen=new Set();const remaining=52-a.length;return raw.filter(x=>{if(seen.has(x.name))return false;seen.add(x.name);return true}).map(x=>({...x,pct:remaining?Math.min(100,(x.outs/remaining)*100):0})).sort((x,y)=>y.outs-x.outs).slice(0,6)}
function analyze(){const a=cards.filter(Boolean);if(a.length<2){setHeat('risk');return{main:'WAITING FOR CARDS',sub:'Enter both of your cards to begin.',hand:'—',draw:'—',outs:'—'}}const h=bestHand(a),d=drawInfo(a);let level='risk',label='HIGH RISK';if(h.rank>=6){level='monster';label='MONSTER'}else if(h.rank>=2){level='strong';label='STRONG'}else if(h.rank===1){level=d.outs>=8?'possible':'caution';label=d.outs>=8?'POSSIBLE':'CAUTION'}else if(d.outs>=8){level='possible';label='POSSIBLE'}else if(d.outs>0){level='caution';label='CAUTION'}setHeat(level);return{main:`${h.name.toUpperCase()} — ${label}`,sub:d.draw==='No major draw'?'No major draw detected right now.':d.draw,hand:h.name,draw:d.draw,outs:d.outs?String(d.outs):'—'}}
function render(){const r=analyze();document.getElementById('heatMain').textContent=r.main;document.getElementById('heatSub').textContent=r.sub;document.getElementById('progress').innerHTML=pages.map((_,i)=>`<div class="prog ${i<page?'done':''} ${i===page?'active':''}"></div>`).join('');if(mode==='heat')renderHeat(r);else renderPossibilities(r);document.getElementById('backBtn').disabled=page===0&&pickMode==='rank';document.getElementById('nextBtn').textContent=page===4?'New Hand':'Next';document.getElementById('nextBtn').disabled=page<4&&!pageComplete()}
function cardSlots(ids){const names=['Card 1','Card 2','Flop 1','Flop 2','Flop 3','Turn','River'];return ids.map(i=>{const c=cards[i],red=c&&(c.s==='h'||c.s==='d');return `<button class="slot ${c?'filled':''} ${red?'red':''} ${i===active&&mode==='heat'&&page<4?'active':''}" onclick="selectSlot(${i})">${c?`${lab(c.r)}${sym(c.s)}`:'+'}<small>${names[i]}</small></button>`}).join('')}
function renderHeat(r){const p=pages[page],ids=page===4?[0,1,2,3,4,5,6]:p.idx;document.getElementById('screen').innerHTML=`<div><div class="eyebrow">PAGE ${page+1} OF 5 • ${p.name}</div><h1 class="title">${p.title}</h1><p class="sub">${p.sub}</p></div><div class="cards">${cardSlots(ids)}</div><div class="wizard"><div><div class="question">${page===4?'Result':questionText(active)}</div><div class="helper">${page===4?'Your current hand and possible improvements are shown below.':pickMode==='rank'?'Choose the card value.':'Now choose the suit.'}</div></div><div class="chooser">${page===4?`<div class="resultGrid"><div class="stat"><b>${r.hand}</b><span>Best Made Hand</span></div><div class="stat"><b>${r.draw}</b><span>Draw / Improvement</span></div><div class="stat"><b>${r.outs}</b><span>Estimated Outs</span></div></div>`:pickerHtml()}</div></div>`}
function pickerHtml(){if(pickMode==='rank')return `<div class="rankgrid">${ranks.map(([l,v])=>`<button class="rankbtn" onclick="pickRank(${v})">${l}</button>`).join('')}</div>`;return `<div class="suitgrid">${suits.map(([u,v])=>`<button class="suitbtn ${v==='h'||v==='d'?'red':''}" ${used(pendingRank,v)?'disabled':''} onclick="pickSuit('${v}')">${u}</button>`).join('')}</div>`}
function renderPossibilities(r){const a=cards.filter(Boolean),p=possibilities(a),known=a.length,remain=Math.max(0,52-known);document.getElementById('screen').innerHTML=`<div><div class="eyebrow">LIVE GAME • POSSIBILITIES</div><h1 class="title">What can this hand become?</h1><p class="sub">This uses the same cards you entered in Hand Heat. Switch back any time to keep entering the board.</p></div><div class="cards">${cardSlots([0,1,2,3,4,5,6])}</div><div class="possibilities"><div class="currentBox"><b>You have: ${r.hand}</b><div>${r.draw==='No major draw'?'No major draw detected.':r.draw} • ${known} cards known • ${remain} unseen</div></div><div class="possGrid">${p.length?p.map(x=>`<div class="poss ${x.outs>=8?'hot':''}"><strong>${x.name}</strong><span>${x.detail}</span><span>${x.outs} estimated outs • ~${x.pct.toFixed(1)}% on the next card</span></div>`).join(''):`<div class="emptyMsg">Enter more cards to see live combination paths.</div>`}</div></div>`}
function selectSlot(i){if(mode!=='heat'||page===4)return;active=i;pendingRank=null;pickMode='rank';render()}function questionText(i){return['What is your first card?','What is your second card?','What is the first flop card?','What is the second flop card?','What is the third flop card?','What is the turn card?','What is the river card?'][i]}function pickRank(r){pendingRank=r;pickMode='suit';render()}function pickSuit(s){if(used(pendingRank,s))return;cards[active]={r:pendingRank,s};pendingRank=null;pickMode='rank';const miss=firstMissing();if(miss!==undefined)active=miss;render()}
document.getElementById('heatModeBtn').onclick=()=>{mode='heat';document.getElementById('heatModeBtn').classList.add('active');document.getElementById('possModeBtn').classList.remove('active');render()};document.getElementById('possModeBtn').onclick=()=>{mode='poss';document.getElementById('possModeBtn').classList.add('active');document.getElementById('heatModeBtn').classList.remove('active');render()};document.getElementById('nextBtn').onclick=()=>{if(page===4){cards=Array(7).fill(null);page=0;active=0;pickMode='rank';mode='heat';document.getElementById('heatModeBtn').classList.add('active');document.getElementById('possModeBtn').classList.remove('active');render();return}if(!pageComplete())return;page++;active=page<4?(firstMissing()??pages[page].idx[0]):0;pickMode='rank';render()};document.getElementById('backBtn').onclick=()=>{if(mode==='poss'){mode='heat';document.getElementById('heatModeBtn').classList.add('active');document.getElementById('possModeBtn').classList.remove('active');render();return}if(pickMode==='suit'){pickMode='rank';pendingRank=null}else if(page>0){page--;active=pages[page].idx[0]}render()};render();
</script></body></html>
