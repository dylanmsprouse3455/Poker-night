<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0102">
<title>Poker Night Scores</title>
<style>
:root{--bg:#070102;--panel:#160307;--panel2:#25070d;--red:#c21632;--gold:#e0b96d;--gold2:#f5daa0;--text:#fff5f6;--muted:#c8abb2;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 80% 0,rgba(194,22,50,.22),transparent 30%),radial-gradient(circle at 20% 100%,rgba(88,0,14,.3),transparent 36%),linear-gradient(180deg,#050102,#110204 48%,#060102)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 8px,transparent 8px 18px),repeating-linear-gradient(-115deg,rgba(255,255,255,.018) 0 10px,transparent 10px 22px);filter:blur(7px)}
.wrap{position:relative;z-index:1;width:min(980px,calc(100% - 24px));margin:auto;padding:max(22px,env(safe-area-inset-top)) 0 max(32px,env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.back{color:var(--gold2);text-decoration:none;font-weight:800;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}.brand{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.hero,.board{border:1px solid var(--line);background:linear-gradient(155deg,rgba(38,7,12,.96),rgba(12,2,4,.98));box-shadow:0 26px 70px rgba(0,0,0,.45);border-radius:30px;overflow:hidden}.hero{padding:24px;position:relative}.hero:after{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.08) 48%,transparent 56%);animation:sheen 7s linear infinite;pointer-events:none}@keyframes sheen{from{transform:translateX(-80%)}to{transform:translateX(80%)}}
.kicker{color:var(--gold2);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:900}.hero h1{margin:10px 0 4px;font-size:clamp(2.4rem,8vw,5rem);line-height:.92;letter-spacing:-.06em;text-transform:uppercase}.hero p{margin:0;color:var(--muted)}
.winner{margin-top:20px;display:flex;gap:16px;align-items:center;padding:18px;border:1px solid rgba(224,185,109,.22);border-radius:24px;background:radial-gradient(circle at top right,rgba(224,185,109,.16),transparent 35%),rgba(255,255,255,.035)}.medal{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:radial-gradient(circle at 30% 30%,#ffe9b7,#d3a64d 72%,#8f5b16);color:#2b1503;font-size:2rem;box-shadow:0 0 30px rgba(224,185,109,.25)}.winner strong{font-size:1.7rem}.winner span{display:block;color:var(--muted);margin-top:3px}
.board{margin-top:18px;padding:16px}.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px;border-radius:21px;background:linear-gradient(160deg,rgba(55,10,17,.88),rgba(20,4,7,.92));border:1px solid rgba(255,255,255,.08);margin-bottom:12px}.row:last-child{margin-bottom:0}.row.first{border-color:rgba(224,185,109,.28);box-shadow:0 0 26px rgba(224,185,109,.08)}.rank{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-weight:900;background:rgba(255,255,255,.06);border:1px solid var(--line)}.first .rank{background:radial-gradient(circle at 30% 30%,#ffe9b7,#d3a64d 72%,#8f5b16);color:#2b1503}.name{font-weight:900;font-size:1.12rem}.status{color:var(--muted);font-size:.9rem;margin-top:3px}.score{font-size:1.7rem;font-weight:950;letter-spacing:-.04em}.date{margin-top:12px;color:var(--muted);text-align:center;font-size:.9rem}
@media(max-width:560px){.row{grid-template-columns:56px minmax(0,1fr)}.score{grid-column:2}.winner{align-items:flex-start}.medal{width:68px;height:68px}}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><a class="back" href="./">← Main Page</a><div class="brand">Poker Night Archive</div></div>
<section class="hero">
<div class="kicker">♦ Last Game Results</div>
<h1>Final Scores</h1>
<p>Display-only results from the latest game night.</p>
<div class="winner"><div class="medal">♛</div><div><strong>Justin</strong><span>Last winner • 280 chips</span></div></div>
</section>
<section class="board">
<div class="row first"><div class="rank">#1</div><div><div class="name">Justin</div><div class="status">Winner</div></div><div class="score">280</div></div>
<div class="row"><div class="rank">#2</div><div><div class="name">Jasmine</div><div class="status">2nd place</div></div><div class="score">208</div></div>
<div class="row"><div class="rank">#3</div><div><div class="name">Dylan</div><div class="status">3rd place</div></div><div class="score">187</div></div>
<div class="row"><div class="rank">#4</div><div><div class="name">James</div><div class="status">4th place</div></div><div class="score">125</div></div>
<div class="date">Latest recorded game night</div>
</section>
</div>
</body>
</html>
